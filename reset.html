<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Chord Creatures</title>
<style>
  body { font-family: system-ui, sans-serif; background: #F3E6D4; color: #3A2F26;
    max-width: 28rem; margin: 2.5rem auto; padding: 0 1.2rem; }
  h1 { color: #3D5A3C; font-size: 1.4rem; }
  input { width: 100%; box-sizing: border-box; padding: .7rem; margin: .35rem 0 1rem;
    border: 1px solid #DFCDB8; border-radius: 10px; font-size: 1rem; }
  button { background: #8B5E34; color: #fff; border: 0; border-radius: 12px;
    padding: .8rem 1.1rem; font-size: 1rem; width: 100%; }
  button:disabled { opacity: .5; }
  .note { color: #6D737A; font-size: .95rem; line-height: 1.4; }
  .err { color: #A65B3A; }
  .ok { color: #2F6B3A; }
  .card { background: #FFF8F0; border: 1px solid #DFCDB8; border-radius: 16px;
    padding: 1.2rem 1rem; }
  #done { display: none; }
</style>
</head>
<body>
<h1 id="title">Choose a new password</h1>
<p class="note" id="lead">This page only sets the password. It does not open the app. Open it from the Reset password button in the newest email.</p>
<div id="box">
  <label>New password</label>
  <input id="p1" type="password" autocomplete="new-password">
  <label>Type it again</label>
  <input id="p2" type="password" autocomplete="new-password">
  <p id="msg" class="note"></p>
  <button id="go" type="button" disabled>Save password</button>
</div>
<div id="done" class="card">
  <p class="ok"><strong>Password saved.</strong></p>
  <p class="note">Open Chord Creatures and sign in with the new password. You can close this page.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const url = 'https://chpbpmofuynujxfawfvs.supabase.co';
const key = 'sb_publishable_rVTtQo3-dY8licUH5Cn2tw_W1Nmt7BQ';
const sb = supabase.createClient(url, key, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: false }
});
const msg = document.getElementById('msg');
const go = document.getElementById('go');
function say(t, ok) {
  msg.className = ok ? 'ok' : 'err';
  msg.textContent = t;
}
function ready() {
  go.disabled = false;
  say('Link is good. Choose a password, then sign in in the app.', true);
}
function finished() {
  document.getElementById('p1').value = '';
  document.getElementById('p2').value = '';
  document.getElementById('box').style.display = 'none';
  document.getElementById('lead').style.display = 'none';
  document.getElementById('title').textContent = 'Password updated';
  document.getElementById('done').style.display = 'block';
  sb.auth.signOut().catch(() => {});
}
async function boot() {
  const q = new URLSearchParams(location.search);
  const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (hash.get('error_description') || q.get('error_description')) {
    say(decodeURIComponent(hash.get('error_description') || q.get('error_description')));
    return;
  }
  if (q.get('code')) {
    const { error } = await sb.auth.exchangeCodeForSession(q.get('code'));
    if (error) { say(error.message); return; }
    ready();
    return;
  }
  const at = hash.get('access_token');
  const rt = hash.get('refresh_token');
  if (at && rt) {
    const { error } = await sb.auth.setSession({ access_token: at, refresh_token: rt });
    if (error) { say(error.message); return; }
    ready();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) { ready(); return; }
  say('No login from this page load. Do not type this address. Tap Reset password in the newest email.');
}
boot();
go.onclick = async () => {
  const a = document.getElementById('p1').value;
  const b = document.getElementById('p2').value;
  if (a.length < 6) { say('Use at least 6 characters.'); return; }
  if (a !== b) { say('Those two passwords do not match.'); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { say('Auth session missing. Open the newest reset email and try again.'); return; }
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) { say(error.message); return; }
  finished();
};
</script>
</body>
</html>
